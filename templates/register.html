{% extends 'base.html' %}
{% block title %}Register | Secure Login System{% endblock %}
{% block content %}
<section class="card">
  <h2>Create Account</h2>
  <form method="POST" autocomplete="off" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label for="username">Username</label>
    <input type="text" id="username" name="username" required minlength="3" maxlength="80" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required maxlength="255" />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="10" maxlength="128" />

    <label for="role">Role</label>
    <select id="role" name="role" required>
      <option value="User">User</option>
      <option value="Admin">Admin</option>
    </select>

    <label for="captcha">CAPTCHA: {{ captcha_question }}</label>
    <input type="text" id="captcha" name="captcha" required />

    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
